<style>
  :root { --bg:#000; --fg:#fff; --muted:rgba(255,255,255,.55); --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh; min-height:100svh;
  }
  .hero { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 0; }
  .hero img { width:100%; max-width:1600px; height:auto; display:block;
    animation:fade 1.6s ease-out both; }
  .bar {
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
    padding:22px clamp(16px,4vw,48px); border-top:1px solid var(--line);
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    animation:fade 1.6s .5s ease-out both;
  }
  .soon { color:var(--fg); font-weight:700; }
  .soon i { display:inline-block; width:7px; height:7px; border-radius:50%; background:#fff;
    margin-right:12px; vertical-align:middle; animation:pulse 2s infinite; }
  .bar a { color:var(--muted); text-decoration:none; transition:color .2s; }
  .bar a:hover { color:var(--fg); }
  .links { display:flex; gap:28px; flex-wrap:wrap; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .m-hero { display:none; }
  @media (max-width:640px) {
    .hero { display:none; }
    .m-hero {
      display:flex; flex:1; position:relative; flex-direction:column; justify-content:flex-end;
      padding:0 16px 32px; min-height:70svh;
      background:#000 url(hero-mobile.jpg) center top / cover no-repeat;
      animation:fade 1.6s ease-out both;
    }
    .m-hero::before { content:""; position:absolute; inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,0) 35%, rgba(0,0,0,.85) 82%, #000 100%); }
    .m-hero h1, .m-hero p { position:relative; }
    .m-hero h1 { font-size:clamp(34px,11.2vw,52px); font-weight:700; line-height:.95; letter-spacing:-.01em; }
    .m-hero p { margin-top:10px; font-size:clamp(13px,4.1vw,18px); font-weight:700; letter-spacing:.02em; }
    .bar { flex-direction:column; align-items:flex-start; letter-spacing:.16em; }
    .links { gap:20px; }
  }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>
  <main class="hero">
    <img src="hero.jpg" width="2023" height="1140" alt="MODELS.DEGREE — Modeling Career System">
  </main>
  <section class="m-hero">
    <h1>MODELS.<br>DEGREE</h1>
    <p>MODELING CAREER SYSTEM</p>
  </section>
  <footer class="bar">
    <span class="soon"><i></i>Coming soon</span>
    <nav class="links">
      <a href="mailto:laysha@models.degree">laysha@models.degree</a>
    </nav>
  </footer>
</body>
</html>
